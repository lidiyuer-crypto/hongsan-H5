<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找兄弟 — 暖暗游戏厅 · 设计原型</title>
<style>
  /* ===== Design System ===== */
  :root {
    --bg-deep:     #1a1510;
    --bg-surface:  #24201a;
    --bg-card:     #2c2720;
    --bg-elevated: #322d26;
    --ink-primary: #e8e0d5;
    --ink-secondary: #8a8070;
    --ink-dim:     #5c564c;
    --accent:      #f0a828;
    --accent-glow: rgba(240, 168, 40, 0.18);
    --accent-soft: rgba(240, 168, 40, 0.08);
    --green:       #7ab87e;
    --green-soft:  rgba(122, 184, 126, 0.15);
    --red:         #c46b6b;
    --red-soft:    rgba(196, 107, 107, 0.15);
    --card-face:   #f5ede0;
    --card-red:    #c0392b;
    --card-black:  #2c2c2c;
    --radius-sm:   4px;
    --radius-md:   8px;
    --radius-lg:   14px;
    --radius-xl:   20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #111;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
    user-select: none; -webkit-user-select: none;
  }

  /* ===== Tab bar (outside phone frame) ===== */
  .demo-tabs {
    display: flex; gap: 4px; margin-bottom: 10px;
    background: #1c1c1c; border-radius: 20px; padding: 3px;
  }
  .demo-tab {
    padding: 6px 20px; border-radius: 18px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
    background: transparent; color: #888;
    transition: all 0.2s;
  }
  .demo-tab.active { background: #333; color: #f0a828; }

  /* ===== Phone Frame ===== */
  .phone-frame {
    background: var(--bg-deep);
    border-radius: 24px;
    border: 2px solid #333;
    overflow: hidden;
    box-shadow: 0 0 0 2px #1a1a1a, 0 20px 60px rgba(0,0,0,0.6);
    position: relative;
  }
  .phone-frame.portrait {
    width: 390px; height: 760px;
  }
  .phone-frame.landscape {
    width: 760px; height: 390px;
  }
  .phone-page { display: none; width: 100%; height: 100%; }
  .phone-page.active { display: flex; }

  /* ===== Shared Components ===== */
  .btn {
    border: none; cursor: pointer; font-weight: 700;
    text-align: center; transition: all 0.15s;
    font-family: inherit; letter-spacing: 0.03em;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #f0a828 0%, #d4880f 100%);
    color: #1a1510; border-radius: var(--radius-lg);
    box-shadow: 0 2px 12px rgba(240,168,40,0.2);
  }
  .btn-secondary {
    background: var(--bg-card); color: var(--ink-primary);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .tag {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: var(--radius-sm); white-space: nowrap;
  }
  .tag-red3  { background: rgba(192,57,43,0.2);  color: #e8837a; }
  .tag-black3 { background: rgba(255,255,255,0.05); color: var(--ink-secondary); }
  .tag-solo   { background: var(--accent-soft); color: var(--accent); }

  .toggle-track {
    width: 44px; height: 24px; border-radius: 12px;
    background: rgba(255,255,255,0.1); cursor: pointer;
    position: relative; transition: background 0.2s;
  }
  .toggle-track.on { background: var(--accent); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: left 0.2s;
  }
  .toggle-track.on .toggle-knob { left: 22px; }

  .stepper {
    display: flex; align-items: center; gap: 6px;
  }
  .stepper-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg-card); color: var(--ink-primary);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper-val { font-size: 16px; font-weight: 800; color: var(--accent); min-width: 20px; text-align: center; }

  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
  }
  .setting-label { font-size: 13px; font-weight: 600; color: var(--ink-secondary); }

  /* Card rendering */
  .card-face {
    border-radius: var(--radius-sm);
    background: var(--card-face);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 900; border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .card-face.red  { color: var(--card-red); }
  .card-face.black { color: var(--card-black); }

  .card-back {
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #2c3e50, #1e3a5f);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }

  /* ======================================== */
  /*  PAGE 1: INDEX (portrait)                */
  /* ======================================== */
  .index-page {
    flex-direction: column; align-items: center;
    justify-content: center; gap: 36px; padding: 0 40px;
  }
  .logo-area { text-align: center; }
  .logo-icon {
    width: 72px; height: 72px; border-radius: var(--radius-lg);
    background: var(--bg-card); margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 32px var(--accent-glow);
    border: 1px solid rgba(240,168,40,0.12);
  }
  .logo-title {
    font-size: 28px; font-weight: 900; letter-spacing: 0.04em;
    background: linear-gradient(180deg, #f5d78c 0%, #f0a828 60%, #b87514 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo-sub {
    font-size: 13px; color: var(--ink-dim); margin-top: 4px;
    letter-spacing: 0.12em;
  }
  .index-btns {
    display: flex; flex-direction: column; gap: 14px;
    width: 100%; max-width: 260px;
  }
  .index-btns .btn { padding: 16px 0; font-size: 16px; }

  .profile-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--bg-surface);
    border-radius: var(--radius-xl); width: 100%; max-width: 260px;
  }
  .avatar-circle {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-card); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--ink-dim);
  }
  .nickname-input {
    background: none; border: none; color: var(--ink-primary);
    font-size: 14px; outline: none; flex: 1; font-family: inherit;
  }
  .nickname-input::placeholder { color: var(--ink-dim); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-card {
    background: var(--bg-surface); border-radius: var(--radius-xl);
    padding: 28px 24px; width: 300px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .modal-title {
    font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 20px;
  }
  .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; padding: 12px 0; font-size: 14px; }

  /* Round select */
  .round-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  .round-opt {
    padding: 8px 0; border-radius: var(--radius-md);
    text-align: center; cursor: pointer; border: none;
    background: transparent; color: var(--ink-dim);
    font-size: 12px; font-weight: 700; font-family: inherit;
  }
  .round-opt.active {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid rgba(240,168,40,0.2);
  }
  .round-opt small { font-size: 10px; opacity: 0.6; display: block; }

  /* Segmented control */
  .segmented {
    display: flex; border-radius: var(--radius-md);
    overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
  }
  .seg-btn {
    padding: 8px 16px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 700; font-family: inherit;
    background: transparent; color: var(--ink-dim);
    transition: all 0.15s;
  }
  .seg-btn.active { background: var(--accent-soft); color: var(--accent); }

  /* ======================================== */
  /*  PAGE 2: ROOM (portrait)                 */
  /* ======================================== */
  .room-page { flex-direction: column; }
  .room-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; flex-shrink: 0;
  }
  .room-code {
    font-size: 22px; font-weight: 900; color: var(--accent);
    letter-spacing: 0.12em;
  }
  .room-code-label { font-size: 12px; color: var(--ink-dim); }
  .diamond-badge {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-card); padding: 6px 12px;
    border-radius: var(--radius-xl); font-size: 13px; font-weight: 700;
  }

  .room-body { display: flex; flex: 1; min-height: 0; }
  .room-left {
    width: 40%; display: flex; align-items: center;
    justify-content: center; padding: 0 12px;
  }
  .settings-card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: 16px 16px; width: 100%;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .settings-card .setting-label { font-size: 12px; }

  .room-right {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding: 0 12px 0 0;
  }
  .seat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr; gap: 10px;
    flex: 1; align-content: center;
  }
  .seat {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
  }
  .seat-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    border: 2px solid rgba(255,255,255,0.06);
  }
  .seat-avatar.ready { border-color: var(--green); box-shadow: 0 0 10px rgba(122,184,126,0.15); }
  .seat-avatar.empty { border-style: dashed; border-color: rgba(255,255,255,0.06); }
  .seat-name { font-size: 12px; font-weight: 600; color: var(--ink-secondary); }
  .seat-badge { font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: var(--radius-sm); }
  .badge-owner { background: var(--accent-soft); color: var(--accent); }
  .badge-bot { background: var(--green-soft); color: var(--green); }

  .room-actions {
    display: flex; gap: 10px; justify-content: center;
    padding: 10px 0;
  }
  .room-actions .btn { flex: 1; padding: 12px 0; font-size: 13px; }

  /* ======================================== */
  /*  PAGE 3: GAME (landscape)                */
  /* ======================================== */
  .game-page {
    flex-direction: column; position: relative;
    background: radial-gradient(ellipse at 50% 65%, #2c2218 0%, #1a1510 70%);
  }

  /* Turn timer */
  .turn-timer {
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px; background: rgba(255,255,255,0.04); z-index: 10;
  }
  .turn-timer-fill {
    height: 100%; width: 40%;
    background: linear-gradient(90deg, #f0a828, #f5d78c);
    transition: width 0.5s linear;
  }

  /* Top zone */
  .game-top-zone {
    display: flex; justify-content: center;
    padding: 6px 0; flex-shrink: 0;
  }
  .player-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px; background: var(--bg-surface);
    border-radius: var(--radius-xl);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .player-row.turn-active {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .p-name { font-size: 12px; font-weight: 700; }
  .p-pot {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--accent); font-weight: 700;
  }

  .mini-cards { display: flex; }
  .mini-card {
    width: 18px; height: 26px; border-radius: 2px; margin-left: -8px;
    font-size: 6px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 800;
  }
  .mini-card:first-child { margin-left: 0; }

  /* Middle zone */
  .game-middle {
    flex: 1; display: flex; min-height: 0; position: relative;
  }
  .side-zone {
    width: 18%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .side-player {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 8px; background: var(--bg-surface);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .side-player.turn-active {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .mini-cards-col { display: flex; flex-direction: column; gap: 1px; align-items: center; }

  /* Center zone */
  .center-zone {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  /* Play slots */
  .play-slot {
    position: absolute; display: flex; align-items: center; gap: 3px;
  }
  .slot-0 { bottom: 8%; left: 50%; transform: translateX(-50%); }
  .slot-1 { left: 4%; top: 50%; transform: translateY(-50%); flex-direction: column; }
  .slot-2 { top: 8%; left: 50%; transform: translateX(-50%); }
  .slot-3 { right: 4%; top: 50%; transform: translateY(-50%); flex-direction: column; }

  .play-card {
    width: 38px; height: 54px; border-radius: 3px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 900;
  }
  .play-card .c-rank { font-size: 16px; line-height: 1; }
  .play-card .c-suit { font-size: 9px; line-height: 1; }

  .pass-tag {
    padding: 4px 14px; border-radius: var(--radius-md);
    background: rgba(255,255,255,0.05); color: var(--ink-dim);
    font-size: 12px; font-weight: 700;
  }
  .che-tag {
    padding: 4px 14px; border-radius: var(--radius-md);
    background: var(--red-soft); color: var(--red);
    font-size: 12px; font-weight: 800;
  }

  .history-pile {
    position: absolute; opacity: 0.35;
    display: flex; flex-wrap: wrap; gap: 1px;
    max-width: 45%; justify-content: center;
  }
  .table-counter {
    position: absolute; top: 12%; right: 12%;
    display: flex; flex-direction: column; align-items: center;
    background: var(--bg-surface); padding: 4px 10px;
    border-radius: var(--radius-md);
  }
  .counter-num { font-size: 18px; font-weight: 900; color: var(--accent); }
  .counter-label { font-size: 9px; color: var(--ink-dim); }

  /* Che timer */
  .che-timer {
    position: absolute; top: 4%; left: 18%; right: 18%;
    display: flex; align-items: center; gap: 8px;
  }
  .che-timer-label { font-size: 11px; color: var(--red); font-weight: 700; }
  .che-timer-track {
    flex: 1; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.06); overflow: hidden;
  }
  .che-timer-fill {
    height: 100%; width: 60%; border-radius: 2px;
    background: linear-gradient(90deg, #c46b6b, #e8837a);
  }

  /* Bottom zone */
  .game-bottom {
    flex-shrink: 0; display: flex; flex-direction: column;
    padding: 0 12px 6px;
  }
  .game-controls {
    display: flex; gap: 8px; justify-content: center; padding: 4px 0;
  }
  .game-btn {
    padding: 8px 22px; border-radius: var(--radius-lg);
    font-size: 13px; font-weight: 700; cursor: pointer;
    border: none; font-family: inherit; transition: all 0.15s;
  }
  .game-btn:active { transform: scale(0.96); }
  .btn-pass { background: rgba(255,255,255,0.05); color: var(--ink-secondary); }
  .btn-hint { background: var(--bg-card); color: var(--ink-primary); border: 1px solid rgba(255,255,255,0.08); }
  .btn-play { background: linear-gradient(135deg, #f0a828, #d4880f); color: #1a1510; }
  .btn-che  { background: linear-gradient(135deg, #c46b6b, #a04444); color: #fff; }

  /* Hand */
  .hand-area {
    display: flex; justify-content: center; overflow-x: auto;
    padding: 4px 0;
  }
  .hand-container { display: flex; }
  .hand-card {
    width: 44px; height: 62px; border-radius: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 900; cursor: pointer;
    margin-left: -14px;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative; border: 2px solid transparent;
  }
  .hand-card:first-child { margin-left: 0; }
  .hand-card.selected {
    transform: translateY(-8px);
    border-color: var(--accent);
    box-shadow: 0 6px 18px var(--accent-glow);
    z-index: 5;
  }
  .hand-card .c-rank { font-size: 14px; line-height: 1; }
  .hand-card .c-suit { font-size: 10px; line-height: 1; }

  .my-info {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 2px 0;
    font-size: 12px; color: var(--ink-secondary);
  }
  .my-name { font-weight: 700; color: var(--ink-primary); }

  /* Float buttons */
  .float-btn {
    position: absolute; z-index: 50;
    padding: 4px 12px; border-radius: var(--radius-xl);
    background: var(--bg-surface);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--ink-secondary); font-size: 11px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .float-br { bottom: 8px; right: 10px; }
  .float-bl { bottom: 8px; left: 10px; }

  /* Settlement overlay */
  .settlement-overlay {
    position: absolute; inset: 0; z-index: 150;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .settlement-card {
    background: var(--bg-surface); border-radius: var(--radius-xl);
    padding: 20px 24px; width: 92%; max-width: 520px;
    display: flex; flex-direction: column; gap: 12px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  }
  .settlement-body { display: flex; gap: 16px; }
  .settlement-left { flex: 1.2; }
  .settlement-right { flex: 1; }
  .settlement-section-title {
    font-size: 13px; font-weight: 800; margin-bottom: 8px;
    color: var(--ink-secondary); text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .team-block {
    background: var(--bg-card); border-radius: var(--radius-md);
    padding: 12px 14px; margin-bottom: 8px;
    position: relative; overflow: hidden;
  }
  .team-block.winner { border: 1px solid var(--accent); }
  .winner-ribbon {
    position: absolute; top: 6px; right: -22px;
    background: var(--accent); color: #1a1510;
    font-size: 9px; font-weight: 800; padding: 2px 24px;
    transform: rotate(45deg);
  }
  .team-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .team-label { font-size: 13px; font-weight: 700; }
  .team-total { font-size: 14px; font-weight: 900; color: var(--accent); }
  .player-result {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0; font-size: 11px;
  }
  .result-rank {
    font-size: 9px; padding: 1px 6px; border-radius: var(--radius-sm);
    font-weight: 700; color: #fff;
  }
  .rank-1 { background: linear-gradient(135deg, #f97316, #ea580c); }
  .rank-2 { background: linear-gradient(135deg, #a855f7, #9333ea); }
  .rank-3 { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .rank-4 { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .rank-beiguan { background: #dc2626; }

  .fin-section { margin-top: 4px; }
  .fin-row {
    display: flex; justify-content: space-between; padding: 4px 0;
    font-size: 11px;
  }
  .fin-label { color: var(--ink-secondary); }
  .fin-value { font-weight: 700; }
  .fin-value.gold { color: var(--accent); }
  .fin-value.big { font-size: 15px; }
  .fin-divider {
    height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0;
  }
  .bomb-mini {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 0; font-size: 10px;
  }
  .fin-player {
    display: flex; justify-content: space-between;
    padding: 3px 0; font-size: 11px;
  }
  .fin-player-net { font-weight: 700; }
  .fin-player-net.positive { color: var(--green); }
  .fin-player-net.negative { color: var(--red); }

  /* Score panel */
  .score-overlay {
    position: absolute; inset: 0; z-index: 160;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }
  .score-card {
    background: var(--bg-surface); border-radius: var(--radius-xl);
    padding: 18px 20px; width: 260px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .score-header {
    display: flex; justify-content: space-between; align-items: center;

  }

  }
  .score-rank-num { font-size: 14px; font-weight: 900; color: var(--accent); width: 20px; }
  .score-pname { flex: 1; font-size: 13px; font-weight: 600; }

  .score-net.positive { color: var(--green); }
  .score-net.negative { color: var(--red); }

  }

  }
</style>
</head>
<body>

<div class="demo-tabs">

<!-- ===== INDEX ===== -->

<div class="desktop-hint">手机比例预览 · 实际开发会按设备自适应</div>

<script>
  function switchPage(name) {
    ['index','room','game'].forEach(n => {
      const page = document.getElementById('page-'+n);
      if (page) page.classList.remove('active');
      const frame = document.getElementById('frame-'+n);
      if (frame) frame.style.display = (n === name) ? '' : 'none';
    });
    document.querySelectorAll('.demo-tab').forEach((b,i,a) => {
      b.classList.remove('active');
      if ((name==='index'&&i===0)||(name==='room'&&i===1)||(name==='game'&&i===2)) b.classList.add('active');
    });
  }
  function showModal(name) {
    document.getElementById('modal-'+name).style.display = 'flex';
  }
  function hideModal(name) {
    document.getElementById('modal-'+name).style.display = 'none';
  }
  // Init: hide room & game frames
  document.getElementById('frame-room').style.display = 'none';
  document.getElementById('frame-game').style.display = 'none';
</script>
